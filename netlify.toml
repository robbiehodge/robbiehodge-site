[functions]
  node_bundler = "esbuild"

# v2 / v2a homepage previews were promoted to / on 2026-10-30
[[redirects]]
  from = "/v2/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/v2a/*"
  to = "/"
  status = 301

# Private Tisas concepts for Kaya. The pages live in the separate robbiehodge-tisas
# Netlify project, which runs the password gate, so nothing private sits in this repo.
[[redirects]]
  from = "/tisas/*"
  to = "https://robbiehodge-tisas.netlify.app/tisas/:splat"
  status = 200
  force = true
